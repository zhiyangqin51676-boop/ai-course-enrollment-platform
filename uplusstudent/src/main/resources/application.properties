spring.application.name=UplusStudent

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ustudent
spring.datasource.username=ustudent
spring.datasource.password=ustudent123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Server Configuration
server.port=8080

# JSON Configuration
spring.jackson.property-naming-strategy=SNAKE_CASE

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,flyway
management.endpoint.health.show-details=when-authorized
